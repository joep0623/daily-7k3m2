<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1115">
<title>备考日程</title>
<style>
:root{
  --bg:#0f1115; --card:#181b21; --card2:#1f232b; --line:#2a2f39;
  --fg:#e8eaed; --fg2:#9aa2b1; --fg3:#6b7280;
  --study:#4a9eff; --body:#3ddc84; --love:#ff6b9d;
  --school:#b388ff; --rest:#5a6272; --life:#ffa94d; --base:#ff5c5c;
  --now:#ffd60a;
  --glass:rgba(15,17,21,.9);
  --tint-now:rgba(255,214,10,.12);
  --tint-now-line:rgba(255,214,10,.4);
  --exam:#ff7a7a;
  --tint-exam:rgba(255,92,92,.14);
  --tint-exam-line:rgba(255,92,92,.42);
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#f5f6f8; --card:#ffffff; --card2:#f0f2f5; --line:#e2e5ea;
    --fg:#1a1d24; --fg2:#5a6272; --fg3:#8b93a1;
    --study:#1d7fe8; --body:#12a55c; --love:#e0357a;
    --school:#7c4dff; --rest:#98a0ae; --life:#d97516; --base:#e03b3b;
    --now:#c79a00;
    --glass:rgba(245,246,248,.9);
    --tint-now:rgba(199,154,0,.12);
    --tint-now-line:rgba(199,154,0,.4);
    --exam:#c62828;
    --tint-exam:rgba(198,40,40,.10);
    --tint-exam-line:rgba(198,40,40,.34);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:15px; line-height:1.5;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
header{
  position:sticky; top:0; z-index:20;
  background:var(--glass);
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:saturate(180%) blur(14px);
  -webkit-backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line);
  padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
}
.hd-top{display:flex; align-items:baseline; justify-content:space-between; gap:12px}
.hd-title{font-size:17px; font-weight:700; letter-spacing:.2px}
.hd-clock{font-size:13px; color:var(--fg2); font-variant-numeric:tabular-nums}
.hd-sub{font-size:12.5px; color:var(--fg3); margin-top:3px}
.hd-title b{color:var(--now); font-size:21px; font-variant-numeric:tabular-nums; letter-spacing:-.3px}
.hd-stage{
  display:inline-block; font-size:11px; font-weight:700; letter-spacing:.3px;
  padding:2.5px 9px; border-radius:20px; margin-top:7px;
  background:var(--tint-now); color:var(--now); border:1px solid var(--tint-now-line);
}
.hd-stage.off{display:none}
.hd-exam{
  display:inline-block; font-size:11px; font-weight:700; letter-spacing:.3px;
  padding:2.5px 9px; border-radius:20px; margin-top:7px; margin-left:6px;
  background:var(--tint-exam); color:var(--exam); border:1px solid var(--tint-exam-line);
}
.hd-exam.off{display:none}

/* ---------- 学校 ---------- */
.exam{display:flex; gap:11px; padding:10px 0; border-bottom:1px solid var(--line)}
.exam:last-child{border-bottom:0}
.exam .ed{flex:0 0 54px; font-size:12.5px; font-weight:700; color:var(--fg2); font-variant-numeric:tabular-nums; padding-top:1px}
.exam .ed .dd{display:block; font-size:10.5px; color:var(--fg3); font-weight:400; margin-top:2px}
.exam .eb{flex:1; min-width:0}
.exam .en{font-size:14px; color:var(--fg); font-weight:600}
.exam .et{font-size:11.5px; color:var(--fg3); margin-top:2px}
.exam .dl2{font-size:11px; font-weight:700; color:var(--fg3); margin-top:3px}
.exam.past{opacity:.38}
.exam.past .en{text-decoration:line-through}
.exam.soon{background:var(--tint-exam); border-radius:10px; padding-left:10px; padding-right:10px; border-bottom-color:transparent; box-shadow:inset 0 0 0 1px var(--tint-exam-line)}
.exam.soon .en,.exam.soon .dl2{color:var(--exam)}
.exbadge{
  display:inline-block; font-size:10px; font-weight:700; color:var(--exam);
  background:var(--tint-exam); border:1px solid var(--tint-exam-line);
  border-radius:4px; padding:0 5px; margin-left:6px; vertical-align:1.5px;
}
nav{
  position:fixed; left:0; right:0; bottom:0; z-index:30;
  display:flex;
  background:var(--glass);
  background:color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter:saturate(180%) blur(14px);
  -webkit-backdrop-filter:saturate(180%) blur(14px);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
nav button{
  flex:1; background:none; border:0; color:var(--fg3);
  font:inherit; font-size:11px; padding:9px 0 8px;
  display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer;
}
nav button .ic{font-size:17px; line-height:1}
nav button.on{color:var(--study)}
main{padding:14px 16px 20px; max-width:780px; margin:0 auto}
section{display:none}
section.on{display:block; animation:fade .18s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}

/* ---------- 今日 ---------- */
.nowbar{
  background:var(--card); border:1px solid var(--line); border-radius:14px;
  padding:14px 16px; margin-bottom:14px;
}
.nowbar .lbl{font-size:11.5px; color:var(--now); font-weight:700; letter-spacing:.8px}
.nowbar .cur{font-size:19px; font-weight:700; margin-top:5px}
.nowbar .meta{font-size:12.5px; color:var(--fg2); margin-top:4px}
.nowbar .bar{height:5px; background:var(--card2); border-radius:3px; margin-top:11px; overflow:hidden}
.nowbar .bar i{display:block; height:100%; background:var(--now); border-radius:3px; transition:width .4s}
.nowbar .nxt{font-size:12.5px; color:var(--fg2); margin-top:9px}
.nowbar .nxt b{color:var(--fg); font-weight:600}

.tl{position:relative}
.row{
  display:flex; gap:12px; padding:9px 4px; border-radius:10px; cursor:pointer;
  transition:background .15s;
}
.row:active{background:var(--card2)}
.row .tm{
  flex:0 0 52px; font-size:12px; color:var(--fg3); text-align:right;
  font-variant-numeric:tabular-nums; padding-top:2px; line-height:1.35;
}
.row .tm .e{display:block; font-size:11px; opacity:.62}
.row .bd{flex:1; min-width:0; border-left:3px solid var(--rest); padding-left:11px; padding-top:1px; padding-bottom:1px}
.row .tt{font-size:14.5px; line-height:1.42; word-break:break-word}
.row .tag{font-size:10.5px; color:var(--fg3); margin-top:3px}
.row.study .bd{border-color:var(--study)}
.row.body  .bd{border-color:var(--body)}
.row.love  .bd{border-color:var(--love)}
.row.school .bd{border-color:var(--school)}
.row.life  .bd{border-color:var(--life)}
.row.base  .bd{border-color:var(--base)}
.row.past{opacity:.38}
.row.live{background:var(--tint-now); box-shadow:inset 0 0 0 1px var(--tint-now-line)}
.row.live .tt{font-weight:700}
.row.done .tt{text-decoration:line-through; opacity:.45}
.pillnow{
  display:inline-block; font-size:10px; font-weight:700; color:#0f1115; background:var(--now);
  border-radius:4px; padding:0 5px; margin-left:7px; vertical-align:1.5px;
}
.nexthint{font-size:12.5px; color:var(--fg2); margin-top:6px}
.nexthint b{color:var(--fg); font-weight:600}

/* ---------- 进度 ---------- */
.tprog{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:13px 16px; margin-bottom:14px}
.tprog .th{display:flex; align-items:baseline; justify-content:space-between; gap:10px}
.tprog .tl2{font-size:12px; color:var(--fg3); font-weight:700; letter-spacing:.5px}
.tprog .tv{font-size:13px; color:var(--fg2); font-variant-numeric:tabular-nums}
.tprog .tv b{color:var(--body); font-size:16px}
.tprog .pb{height:7px; background:var(--card2); border-radius:4px; overflow:hidden; margin-top:9px}
.tprog .pb i{display:block; height:100%; background:var(--body); border-radius:4px; transition:width .35s}

.pc{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:11px}
.pc-h{display:flex; align-items:baseline; justify-content:space-between; gap:10px}
.pc-n{font-size:15.5px; font-weight:700}
.pc-s{display:block; font-size:11.5px; color:var(--fg3); font-weight:400; margin-top:2px}
.pc-p{font-size:18px; font-weight:700; color:var(--study); font-variant-numeric:tabular-nums; letter-spacing:-.5px}
.pb2{height:9px; background:var(--card2); border-radius:5px; overflow:hidden; margin:10px 0 8px}
.pb2 i{display:block; height:100%; background:linear-gradient(90deg, var(--study), var(--body)); border-radius:5px; transition:width .4s}
.pc-f{display:flex; justify-content:space-between; gap:10px; font-size:12px; color:var(--fg3)}
.pc-f b{color:var(--fg2); font-weight:600}
.pc.done .pc-p{color:var(--body)}
.pc.done .pb2 i{background:var(--body)}
.row .crs{font-size:10.5px; color:var(--study); font-weight:700; margin-top:2px}

.notes{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 15px; margin-top:14px}
.notes .nt{font-size:11.5px; color:var(--fg3); font-weight:700; letter-spacing:.6px; margin-bottom:7px}
.notes ul{margin:0; padding-left:17px; color:var(--fg2); font-size:13px}
.notes li{margin:5px 0}

/* ---------- 本周 ---------- */
.dcard{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:13px 15px; margin-bottom:11px; cursor:pointer; transition:transform .12s, border-color .15s}
.dcard:active{transform:scale(.985)}
.dcard:hover{border-color:color-mix(in srgb, var(--study) 45%, var(--line))}
.dcard.today{border-color:color-mix(in srgb, var(--now) 55%, var(--line))}
.dcard .more{font-size:11px; color:var(--fg3); margin-top:8px; padding-top:8px; border-top:1px dashed var(--line); display:flex; justify-content:space-between}
.dcard .more b{color:var(--study); font-weight:600}

/* ---------- 当天详情弹层 ---------- */
.sheet{position:fixed; inset:0; z-index:50; display:none}
.sheet.on{display:block}
.sheet-mask{position:absolute; inset:0; background:rgba(0,0,0,.55); animation:fade .18s ease-out}
.sheet-box{
  position:absolute; left:50%; transform:translateX(-50%); bottom:0; width:100%; max-width:640px;
  max-height:88vh; overflow-y:auto; -webkit-overflow-scrolling:touch;
  background:var(--bg); border-radius:20px 20px 0 0;
  border-top:1px solid var(--line);
  padding:16px 16px calc(24px + env(safe-area-inset-bottom));
  animation:up .22s cubic-bezier(.2,.9,.3,1);
}
@keyframes up{from{transform:translate(-50%,100%)}to{transform:translate(-50%,0)}}
.sheet-top{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px}
.sheet-t{font-size:16.5px; font-weight:700}
.sheet-t .s2{display:block; font-size:12px; color:var(--fg3); font-weight:400; margin-top:3px}
.sheet-x{
  flex:0 0 32px; height:32px; border-radius:50%; border:1px solid var(--line);
  background:var(--card); color:var(--fg2); font-size:15px; cursor:pointer; line-height:1;
}
.sheet-x:active{background:var(--card2)}
.dh{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:9px}
.dh .d1{font-size:15px; font-weight:700}
.dh .d2{font-size:12px; color:var(--fg3)}
.dl{list-style:none; margin:0; padding:0}
.dl li{display:flex; gap:9px; font-size:13px; padding:3.5px 0; color:var(--fg2)}
.dl li .t{flex:0 0 48px; font-size:11.5px; color:var(--fg3); font-variant-numeric:tabular-nums; padding-top:1.5px}
.dl li .n{flex:1; word-break:break-word}
.dl li.hi .n{color:var(--fg); font-weight:600}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:1px;vertical-align:0}
.dot.study{background:var(--study)} .dot.body{background:var(--body)}
.dot.love{background:var(--love)} .dot.school{background:var(--school)}
.dot.rest{background:var(--rest)} .dot.life{background:var(--life)} .dot.base{background:var(--base)}

/* ---------- 通用 ---------- */
h2{font-size:14px; font-weight:700; color:var(--fg); margin:22px 0 9px; letter-spacing:.3px}
h2:first-child{margin-top:4px}
.box{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:12px}
.box.warn{border-color:color-mix(in srgb, var(--base) 42%, var(--line))}
.box ul{margin:0; padding-left:18px; font-size:13.5px; color:var(--fg2)}
.box ul li{margin:7px 0}
.box ul li b{color:var(--fg)}
.box ol{margin:0; padding-left:19px; font-size:13.5px; color:var(--fg2)}
.box ol li{margin:7px 0}
.muted{font-size:12.5px; color:var(--fg3); margin-top:8px; line-height:1.55}
.ck{list-style:none; margin:0; padding:0}
.ck li{display:flex; gap:10px; align-items:flex-start; font-size:13.5px; color:var(--fg2); padding:8px 0; border-bottom:1px solid var(--line); cursor:pointer}
.ck li:last-child{border-bottom:0}
.ck .bx{
  flex:0 0 19px; height:19px; border:1.5px solid var(--line); border-radius:6px; margin-top:1px;
  display:flex; align-items:center; justify-content:center; font-size:12px; color:transparent; transition:.15s;
}
.ck li.ok .bx{background:var(--body); border-color:var(--body); color:#0f1115}
.ck li.ok span{text-decoration:line-through; opacity:.45}
table{width:100%; border-collapse:collapse; font-size:13px}
th,td{text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); vertical-align:top}
th{color:var(--fg3); font-weight:600; font-size:11.5px; letter-spacing:.4px}
td{color:var(--fg2)}
td:first-child{color:var(--fg); font-weight:600; white-space:nowrap}
.lvl{display:inline-block; font-size:11px; font-weight:700; padding:1px 7px; border-radius:5px; margin-bottom:8px}
.lvl.g{background:color-mix(in srgb, var(--body) 22%, transparent); color:var(--body)}
.lvl.y{background:color-mix(in srgb, var(--life) 22%, transparent); color:var(--life)}
.lvl.r{background:color-mix(in srgb, var(--base) 22%, transparent); color:var(--base)}
.kv{display:flex; justify-content:space-between; font-size:13px; padding:7px 0; border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--fg2)}
.kv .v{color:var(--fg); font-weight:600; font-variant-numeric:tabular-nums}

/* ---------- 路线图 ---------- */
.stage{display:flex; gap:10px; padding:9px 0; border-bottom:1px solid var(--line)}
.stage:last-child{border-bottom:0}
.stage .sn{flex:0 0 20px; font-weight:700; font-size:12px; color:var(--fg3); padding-top:1.5px}
.stage .sb{flex:1; min-width:0}
.stage .t1{font-size:13.5px; color:var(--fg2); font-weight:600}
.stage .t2{font-size:11.5px; color:var(--fg3); margin-top:2px; line-height:1.5}
.stage.past{opacity:.4}
.stage.now{
  background:var(--tint-now); border-radius:10px; padding-left:10px; padding-right:10px;
  border-bottom-color:transparent; box-shadow:inset 0 0 0 1px var(--tint-now-line);
}
.stage.now .sn,.stage.now .t1{color:var(--now)}
.stage.now .t1{font-weight:700}
@media(max-width:430px){
  main{padding:12px 13px 20px}
  header{padding-left:13px; padding-right:13px}
  .row .tm{flex-basis:46px; font-size:11.5px}
  .row .tt{font-size:14px}
}
</style>
</head>
<body>

<header>
  <div class="hd-top">
    <div class="hd-title" id="hdTitle">—</div>
    <div class="hd-clock" id="hdClock">--:--</div>
  </div>
  <div class="hd-stage" id="hdStage">—</div>
  <div class="hd-exam off" id="hdExam">—</div>
  <div class="hd-sub" id="hdSub">—</div>
</header>

<main>
  <section id="vToday" class="on"></section>
  <section id="vWeek"></section>
  <section id="vProgress"></section>
  <section id="vSchool"></section>
  <section id="vRules"></section>
  <section id="vSOS"></section>
</main>

<nav>
  <button class="on" data-v="vToday"><span class="ic">◉</span>今日</button>
  <button data-v="vWeek"><span class="ic">▤</span>本周</button>
  <button data-v="vProgress"><span class="ic">▰</span>进度</button>
  <button data-v="vSchool"><span class="ic">◆</span>学校</button>
  <button data-v="vRules"><span class="ic">✓</span>规范</button>
  <button data-v="vSOS"><span class="ic">!</span>应急</button>
</nav>

<div class="sheet" id="sheet">
  <div class="sheet-mask" data-close="1"></div>
  <div class="sheet-box">
    <div class="sheet-top">
      <div class="sheet-t" id="sheetTitle">—</div>
      <button class="sheet-x" data-close="1">✕</button>
    </div>
    <div id="sheetBody"></div>
  </div>
</div>

<script>
/* ================================================================
   ★★★ 每周只需要改这一段 ★★★
   在 WEEKS 数组最前面加一个新周对象即可，旧周保留（可回看）
   ================================================================ */

/* B(开始, 结束, 内容, 类型, 课程key, 本次推进几讲)
   带「课程key」的时段，打勾后会推进该课程的进度条 */
const B = (s, e, t, k, c, n) => ({ s, e, t, k, c: c || null, n: n || 0 });

/* ★ 课程进度追踪
   total = 这门课一共多少讲。⚠️ 下面的数字是占位，等你按网盘里的课程列表给我实际数字。
   改完之后：进度条、剩余讲数、预计完成日期都会自动重算。 */
const COURSES = {
  zhenduan: { name:'诊断学', sub:'徐琦 · 症状6 / 体格11 / 实验11 / 器械10', total: 38 },
  shengli:  { name:'生理学', sub:'侯英健 · 网课', total: 56 },
  yingyu:   { name:'英语真题精读', sub:'唐迟 · 阅读', total: 30 },
};
/* 每周几要上课（用于推算未来的推进速度）
   Monday=1 … Sunday=0，对应 TPL 里的模板名 */
const DOW_TPL = { 0:'sunday', 1:'workday', 2:'workday', 3:'wednesday',
                  4:'workday', 5:'workday', 6:'saturday' };

/* ★ 初试日期。确认年份后，改这一行就行（倒计时会自动重算） */
const EXAM_DATE = '2028-12-23';

/* ★ 全程路线图。页面自动识别今天落在哪个阶段并高亮，不用手动切 */
const STAGES = [
  { n:'A', name:'打地基',       when:'大三上',   from:'2026-10-01', to:'2027-01-31', desc:'课内扎实 + 英语起步 + 生理推进 → 1 月中旬三段考（≈西综一轮预演）' },
  { n:'B', name:'西综一轮前半', when:'大三下',   from:'2027-02-01', to:'2027-06-30', desc:'生理 → 生化 → 病理，每章配真题（三段考已过一遍，这里是加固）' },
  { n:'C', name:'黄金期',       when:'大三暑假', from:'2027-07-01', to:'2027-08-31', desc:'内科 → 外科，一轮收尾。唯一整块时间' },
  { n:'D', name:'西综二轮',     when:'大四上',   from:'2027-09-01', to:'2028-01-31', desc:'近 15 年真题成套刷，建错题本' },
  { n:'E', name:'西综三轮',     when:'大四下',   from:'2028-02-01', to:'2028-07-31', desc:'专攻错题与薄弱章节' },
  { n:'F', name:'强化期',       when:'大五上',   from:'2028-08-01', to:'2028-10-31', desc:'政治启动（徐涛 + 1000 题），西综真题第 3 遍' },
  { n:'G', name:'冲刺期',       when:'实习中',   from:'2028-11-01', to:'2028-12-31', desc:'肖四背诵 + 西综错题本 + 英语作文' },
];

/* ★ 三段考（临床医学专业强制参加）
   官方规则：机考，分两部分 × 每部分 200 题，4 小时；满分 100，60 分以下补考；

/* ---------- 时间工具 ---------- */
const toMin = t => { const [h,m] = t.split(':').map(Number); return h*60+m; };
const fmt   = m => String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const parseD= s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };

/* 凌晨（0:00–7:00）算作前一天，避免跨夜错位 */
function logicalNow(){
  const n = new Date();
  const mins = n.getHours()*60 + n.getMinutes();
  const d = new Date(n.getFullYear(), n.getMonth(), n.getDate());
  if (mins < 420) { d.setDate(d.getDate()-1); return { date:d, mins: mins+1440 }; }
  return { date:d, mins };
}
const ymd = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');

const KIND = { study:'学习', body:'身体', love:'约会', school:'学校', life:'生活', rest:'自由', base:'底线' };

/* ---------- 状态 ---------- */
let todayKey = ymd(logicalNow().date);

/* 自动选中「今天」所在的那一周；今天不在任何一周里就停在最新一周 */
function pickWeekIdx(){
  const i = WEEKS.findIndex(w => w.days.some(d => d.date === todayKey));
  return i >= 0 ? i : WEEKS.length - 1;
}
let weekIdx = pickWeekIdx();
let week = WEEKS[weekIdx];

/* 当前所处阶段（自动识别） */
function currentStage(){
  const t = logicalNow().date;
  return STAGES.find(s => t >= parseD(s.from) && t <= parseD(s.to)) || null;
}

/* 下一场学校考试（已过期的不算） */
function nextExam(){
  const t = logicalNow().date;
  return SCHOOL_EVENTS
    .map(e => ({ ...e, d: parseD(e.date) }))
    .filter(e => e.d >= t)
    .sort((a, b) => a.d - b.d)[0] || null;
}
const WEEKDAYS = ['周日','周一','周二','周三','周四','周五','周六'];
const md = d => (d.getMonth()+1)+'月'+d.getDate()+'日';

/* ---------- 顶部 ---------- */
function renderHead(){
  const { date, mins } = logicalNow();
  const day = week.days.find(d => d.date === ymd(date));

  const left = Math.ceil((parseD(EXAM_DATE) - date) / 86400000);
  document.getElementById('hdTitle').innerHTML =
    left >= 0 ? '距初试 <b>' + left + '</b> 天' : '初试已过 <b>' + (-left) + '</b> 天';
  document.getElementById('hdClock').textContent = fmt(mins);

  const st = currentStage();
  const el = document.getElementById('hdStage');
  if (st){ el.className = 'hd-stage'; el.textContent = '阶段 ' + st.n + ' · ' + st.name + '（' + st.when + '）'; }
  else { el.className = 'hd-stage off'; }

  // 考试倒计时：只在考前 30 天内出现
  const nx = nextExam();
  const xe = document.getElementById('hdExam');
  if (nx){
    const dl = Math.round((nx.d - date) / 86400000);
    if (dl <= 30){
      xe.className = 'hd-exam';
      xe.textContent = dl === 0 ? '今天考「' + nx.name + '」' : '距「' + nx.name + '」' + dl + ' 天';
    } else { xe.className = 'hd-exam off'; }
  } else { xe.className = 'hd-exam off'; }

  document.getElementById('hdSub').textContent =
    week.title + ' · ' + md(date) + ' ' + WEEKDAYS[date.getDay()] + (day && day.tag ? ' · ' + day.tag : '');
}

/* ---------- 共用：时间轴 / 提醒 ---------- */

/* blocks → 时间轴 HTML。withNow=true 时标记「已过 / 进行中」 */
function timelineHTML(blocks, key, withNow){
  const mins = logicalNow().mins;
  const bs = blocks.map(b => ({ ...b, sm: toMin(b.s), em: toMin(b.e) }));
  const live = withNow ? bs.find(b => mins >= b.sm && mins < b.em) : null;
  return bs.map((b,i) => {
    const past = withNow && mins >= b.em;
    const isLive = live === b;
    const dk = 'ck:'+key+':'+i;
    const done = localStorage.getItem(dk) === '1';
    const cls = ['row', b.k, past?'past':'', isLive?'live':'', done?'done':''].filter(Boolean).join(' ');
    let crs = '';
    if (b.c && COURSES[b.c]){
      const c = COURSES[b.c];
      crs = '<div class="crs">' + c.name + ' · 第 ' + lectureNo(key, i, b.c) + ' 讲 / 共 ' + c.total + '</div>';
    }
    return '<div class="'+cls+'" data-ck="'+dk+'">'
      + '<div class="tm">'+fmt(b.sm)+'<span class="e">'+fmt(b.em)+'</span></div>'
      + '<div class="bd"><div class="tt">'+b.t+(isLive?'<span class="pillnow">现在</span>':'')+'</div>'
      + '<div class="tag">'+KIND[b.k]+'</div>'+crs+'</div></div>';
  }).join('');
}

/* 自主学习净时长（只算 study —— 上课、家教是 school，不计入） */
function studyH(blocks){
  const mins = blocks.filter(b => b.k==='study')
    .reduce((s,b) => s + toMin(b.e) - toMin(b.s), 0);
  return (mins/60).toFixed(1);
}

/* ---------- 课程进度 ---------- */

/* 取某天的时段：WEEKS 里有就用它，否则按星期推模板（带缓存） */
const _bfCache = {};
function blocksFor(dateStr){
  if (_bfCache[dateStr]) return _bfCache[dateStr];
  let out = null;
  for (const w of WEEKS){
    const d = w.days.find(x => x.date === dateStr);
    if (d){ out = d.blocks; break; }
  }
  if (!out) out = TPL[DOW_TPL[parseD(dateStr).getDay()]] || [];
  return (_bfCache[dateStr] = out);
}

/* 该课程已完成多少讲（= 所有已打勾的带课程时段之和） */
function courseDone(key){
  let done = 0;
  WEEKS.forEach(w => w.days.forEach(d => d.blocks.forEach((b,i) => {
    if (b.c === key && b.n && localStorage.getItem('ck:'+d.date+':'+i) === '1') done += b.n;
  })));
  return done;
}

/* 未来 days 天的日均推进讲数（用模板推算） */
function dailyRate(key, days){
  let sum = 0;
  const t = logicalNow().date;
  for (let i = 0; i < days; i++){
    const d = new Date(t.getFullYear(), t.getMonth(), t.getDate() + i);
    blocksFor(ymd(d)).forEach(b => { if (b.c === key) sum += b.n; });
  }
  return sum / days;
}

/* 进度 + 预计完成日期 */
function courseStat(key){
  const c = COURSES[key];
  const done = Math.min(courseDone(key), c.total);
  const remain = Math.max(0, c.total - done);
  const pct = c.total ? Math.round(done / c.total * 100) : 0;
  if (remain === 0) return { done, remain, pct:100, text:'已完成 ✓', finished:true };
  const rate = dailyRate(key, 28);
  if (rate <= 0) return { done, remain, pct, text:'近期无安排' };
  const days = Math.ceil(remain / rate);
  const t = logicalNow().date;
  const eta = new Date(t.getFullYear(), t.getMonth(), t.getDate() + days);
  return { done, remain, pct, rate, days, eta,
           text:(eta.getMonth()+1)+'月'+eta.getDate()+'日',
           etaPast: eta > parseD(EXAM_DATE) };
}

/* 该时段是这门课的第几讲（从计划起点逐日累加，带缓存） */
const _lnCache = {};
function lectureNo(dateStr, idx, key){
  const ck = dateStr + '|' + idx + '|' + key;
  if (_lnCache[ck] != null) return _lnCache[ck];

  let n = 0;
  const target = parseD(dateStr);
  const d = parseD('2026-10-09');          // 计划起点
  let guard = 0;
  while (d < target && guard++ < 1200){
    blocksFor(ymd(d)).forEach(b => { if (b.c === key) n += b.n; });
    d.setDate(d.getDate() + 1);
  }
  const bl = blocksFor(dateStr);
  for (let i = 0; i < idx; i++){ if (bl[i] && bl[i].c === key) n += bl[i].n; }
  return (_lnCache[ck] = n + 1);
}

  const blocks = day.blocks.map(b => ({ ...b, sm: toMin(b.s), em: toMin(b.e) }));

  let head = '';

    head = '<div class="nowbar">'
      + '<div class="lbl">◆ 正在进行</div>'

      + '<div class="meta">'+fmt(live.sm)+' – '+fmt(live.em)+' ／ 还剩 '+(left>=60?Math.floor(left/60)+' 小时 '+(left%60?left%60+' 分':'').trim():left+' 分钟')+'</div>'
      + '<div class="bar"><i style="width:'+pct+'%"></i></div>'
      + (next ? '<div class="nxt">下一项：<b>'+fmt(next.sm)+' '+next.t+'</b></div>' : '<div class="nxt">今天最后一项了</div>')
      + '</div>';

      + '<div class="lbl">'+(doneAll?'◆ 今天已结束':'◆ 自由时间')+'</div>'
      + '<div class="cur">'+(doneAll ? '该睡了' : (next ? '下一项：'+next.t : '今天没有更多安排'))+'</div>'
      + (next ? '<div class="meta">'+fmt(next.sm)+' 开始 ／ 还有 '+Math.floor((next.sm-mins)/60)+' 小时 '+((next.sm-mins)%60)+' 分</div>' : '')
      + '</div>';

  let doneBlk = 0;
  day.blocks.forEach((b,i) => { if (localStorage.getItem('ck:'+key+':'+i) === '1') doneBlk++; });

    + '<div class="tl2">今日进度</div>'
    + '<div class="tv"><b>'+doneBlk+'</b> / '+totalBlk+' 个时段</div></div>'
    + '<div class="pb"><i style="width:'+Math.round(doneBlk/totalBlk*100)+'%"></i></div></div>';

  el.innerHTML = head + tp + '<div class="tl">'+timelineHTML(day.blocks, key, true)+'</div>' + notesHTML(day);
}

/* ---------- 交互 ---------- */
document.querySelectorAll('nav button').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on', b===btn));
    document.querySelectorAll('main section').forEach(s=>s.classList.toggle('on', s.id===btn.dataset.v));
    window.scrollTo(0,0);
  };
});

document.addEventListener('click', e => {
  // 关闭弹层（点遮罩 / 点 ✕）
  if (e.target.closest('[data-close]')){ closeSheet(); return; }

  // 打勾（今日页 与 弹层内 通用）
  const row = e.target.closest('[data-ck]');
  if (row){
    const k = row.dataset.ck;
    const on = localStorage.getItem(k) === '1';
    localStorage.setItem(k, on ? '0' : '1');
    row.classList.toggle('done', !on);
    // 打勾会推进课程进度 → 刷新相关视图
    renderToday(); renderProgress(); renderWeek();
    if (sheetDate) openDay(sheetDate);
    return;
  }

  // 本周：点某一天 → 打开当天完整安排
  const dc = e.target.closest('[data-day]');
  if (dc){ openDay(dc.dataset.day); return; }

  const li = e.target.closest('#todoList li');
  if (li){
    const k = li.dataset.k;
    const on = localStorage.getItem(k) === '1';
    localStorage.setItem(k, on ? '0' : '1');
    li.classList.toggle('ok', !on);
  }
});

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

/* 恢复勾选状态 */
function restore(){
  document.querySelectorAll('#todoList li').forEach(li=>{
    if (localStorage.getItem(li.dataset.k) === '1') li.classList.add('ok');
  });
}

/* ---------- 启动 ---------- */
let lastKey = todayKey;
function tick(){
  const { date } = logicalNow();
  if (ymd(date) !== lastKey){
    lastKey = ymd(date);
    todayKey = ymd(date);
    weekIdx = pickWeekIdx();
    week = WEEKS[weekIdx];
    renderAll();
    return;
  }
  renderHead(); renderToday();
}
function renderAll(){ renderHead(); renderToday(); renderWeek(); renderProgress(); renderSchool(); renderRules(); renderSOS(); restore(); }
renderAll();
setInterval(tick, 30000);
</script>
