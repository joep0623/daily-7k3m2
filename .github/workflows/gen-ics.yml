name: 自动重新生成日历

# 只要 index.html 变了，就自动重跑 gen_ics.py 并提交新的 schedule.ics。
# 这样无论从哪里改日程（Mac / 手机 / Claude 网页版），桌面小组件都会跟着更新。

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'gen_ics.py'
      - '.github/workflows/gen-ics.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gen-ics:
    # 用 macOS 跑，因为 gen_ics.py 靠 JavaScriptCore(osascript) 从 index.html 提取数据
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 生成 schedule.ics
        run: python3 gen_ics.py

      - name: 提交（没有变化就跳过）
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schedule.ics
          if git diff --staged --quiet; then
            echo "schedule.ics 没有变化，跳过提交"
          else
            git commit -m "自动更新 schedule.ics"
            git push
          fi
